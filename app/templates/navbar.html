<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            background-color: skyblue;
            color: white;
            padding: 15px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 18px;
            font-weight: bold;
        }

        .nav-toggle {
            display: none;
            font-size: 28px;
            cursor: pointer;
            color: black;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links button {
            background-color: rgb(87, 162, 192);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .nav-links button:hover {
            background-color: orange;
        }

        .nav-links i {
            font-size: 26px;
            color: black;
        }

        .nav-links i:hover {
            color: orange;
        }


        @media (max-width: 768px) {
            .nav-toggle {
                display: block;
            }

            .nav-links {
        /* no display: none */
        flex-direction: column;
        width: 100%;
        margin-top: 10px;
        overflow: hidden;
        max-height: 0;
        opacity: 0;
        transition: max-height 0.6s ease, opacity 0.6s ease;
    }

    .nav-links.active {
        max-height: 500px;
        opacity: 1;
    }

    .sidebar-menu a {
      font-size: 16px;
      padding: 12px;
    }
            /* .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                margin-top: 10px;
            }

            .nav-links.active {
                display: flex;
            } */

            .nav-links a, .nav-links button {
                width: 100%;
                text-align: left;
                padding: 10px 10px;
            }
        }

        .sidebar-menu ul {
    padding: 0;
    margin: 0;
    list-style: none;
  }

  .sidebar-menu li {
    margin-bottom: 10px;
  }

  .sidebar-menu a {
    display: block;
    padding: 10px 15px;
    color: rgb(35, 35, 35);
    background-color: white;
    border-radius: 5px;
    text-decoration: none;
    transition: background 0.3s ease;
    font-weight: bold;
  }

  .sidebar-menu a:hover,
  .sidebar-menu a.active {
    /* background-color: #babcbd; */
    background-color: rgb(87, 162, 192);
  }

<div class="sidebar-menu">
  <ul>
    <li>
      <a href="{% url 'formpage' %}" class="{% if request.resolver_match.url_name == 'formpage' %}active{% endif %}">
        📊 Dashboard
      </a>
    </li>
    <li>
      <a href="{% url 'profile' %}" class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
        👤 Profile
      </a>
    </li>

    {% if is_main_user or is_sub_mainuser %}
          <div class="mt-4 px-3">
            <h5 class="text-center">🙍🏻Users</h5>
            <ul class="list-unstyled text-black">
              {% for u in users %}
              <li>
                <a href="{% url 'formpage' %}?user_id={{ u.id }}" style="color: black;">
                  📌 {{ u.username }}
                </a>
              </li>
              {% endfor %}
            </ul>
          </div>
          {% endif %}

        <li>
        <a href="{% url 'login' %}" onclick="logoutUser()"><button>Logout</button></a>
    </li>
  </ul>
