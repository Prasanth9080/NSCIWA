{% extends "base.html" %}
{% block title %}Edit KYC{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Edit KYC</h2>

    <div class="card p-4 shadow">
        <form method="post" enctype="multipart/form-data">

<div class="col-md-6">

        <option value="senior" {% if kyc.membershiptype == "senior" %}selected{% endif %}>Senior</option>
    </select>
</div>

<div class="col-md-6">
    <label>Depositor's Name:</label>
    <input type="text" name="depositorsname" value="{{ kyc.depositorsname }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>Depositor's Address:</label>
    <input type="text" name="depositorsaddress" value="{{ kyc.depositorsaddress }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>Company Name:</label>
    <input type="text" name="nameofthecompany" value="{{ kyc.nameofthecompany }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>Customer ID No:</label>
    <input type="number" name="customeridno" value="{{ kyc.customeridno }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>Receipt No:</label>
    <input type="number" name="receiptno" value="{{ kyc.receiptno }}" class="form-control" required>
</div>

<div class="col-md-6">

    <input type="number" name="modno" value="{{ kyc.modno }}" class="form-control" required>
</div>

<div class="col-md-6">

<div class="col-md-6">

</div>

<div class="col-md-6">

</div>

</div>

<div class="col-md-6">

    <input type="text" name="bondholdername" value="{{ kyc.bondholdername }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>Project Name:</label>
    <input type="text" name="projectname" value="{{ kyc.projectname }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>Depositor Mobile No:</label>
    <input type="text" name="depositormobile_number" value="{{ kyc.depositormobile_number }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>Agent Name:</label>
    <input type="text" name="agentname" value="{{ kyc.agentname }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>Agent Address:</label>
    <input type="text" name="agentaddress" value="{{ kyc.agentaddress }}" class="form-control" required>

<div class="col-md-6">

  </div>

<div class="col-md-6">

<div class="col-md-6">

    <input type="text" name="pan_number" value="{{ kyc.pan_number }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>Ration Card Number:</label>
    <input type="text" name="ration_number" value="{{ kyc.ration_number }}" class="form-control" required>
</div>

<div class="col-md-6">

    <input type="text" name="bankname" value="{{ kyc.bankname }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>Bank Account Number:</label>
    <input type="text" name="bankaccno" value="{{ kyc.bankaccno }}" class="form-control" required>
</div>

<div class="col-md-6">
    <label>IFSC Code:</label>
    <input type="text" name="ifscno" value="{{ kyc.ifscno }}" class="form-control" required>
</div>

            </div>

            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-primary">Update</button>
            </div>
        </form>
    </div>
</div>

<!-- Add bond images -->

<script>
function addBondInput() {
  const bondInputs = document.getElementById('bondInputs');

  const group = document.createElement('div');
  group.className = 'bond-input-group border p-3 mb-3';
  group.innerHTML = `
     <div class="row">
      <div class="col-md-6 mb-3">
        <label><strong>Bond Image:</strong></label>
        <input type="file" name="bonds" accept="image/*" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label><strong>Company Name:</strong></label>
        <input type="text" name="companyname" placeholder="Company Name" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label><strong>Project Name:</strong></label>
        <input type="text" name="projectname" placeholder="Project Name" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label><strong>Amount:</strong></label>
        <input type="number" step="0.01" name="amount" placeholder="Amount" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label><strong>Investment Date:</strong></label>
        <input type="text" name="investment_date" class="form-control investment-date" placeholder="Investment Date" required>
      </div>
      <div class="col-md-6 mb-3">
        <label><strong>Customer ID:</strong></label>
        <input type="text" name="customer_id" placeholder="Customer ID" class="form-control" required>
      </div>
    </div>
  `;

  bondInputs.appendChild(group);
}
</script>

<!-- Aadhar number -->

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const aadharInput = document.getElementById("aadharInput");

    aadharInput.addEventListener("input", function () {
      // Only digits, max 12
      let digits = this.value.replace(/\D/g, "").substring(0, 12);

      // Add space after every 4 digits: XXXX XXXX XXXX
      let formatted = '';
      for (let i = 0; i < digits.length; i++) {
        if (i > 0 && i % 4 === 0) formatted += ' ';
        formatted += digits[i];
      }

      this.value = formatted;
    });

    aadharInput.addEventListener("keydown", function (e) {
      const allowed = ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "Tab"];
      if (allowed.includes(e.key)) return;

      // Block any non-digit key
      if (!/^\d$/.test(e.key)) {
        e.preventDefault();
      }
    });

    // Prevent invalid paste
    aadharInput.addEventListener("paste", function (e) {
      const data = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "");
      if (data.length > 12) e.preventDefault();
    });
  });
</script>

<!-- Contact of the leader -->

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const contactInput = document.querySelector('input[name="contactSH"]');

    contactInput.addEventListener("input", function () {
      // Remove all non-numeric characters
      this.value = this.value.replace(/\D/g, '');
    });

    contactInput.addEventListener("keydown", function (e) {
      const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'];
      if (allowedKeys.includes(e.key)) return;

      // Block non-numeric keys
      if (!/^\d$/.test(e.key)) {
        e.preventDefault();
      }
    });
  });
</script>
