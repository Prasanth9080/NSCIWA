{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<!-- Association Name -->
<div class="col-lg-3 col-md-3 col-sm-12 mb-3">
  <label for="associationname" class="form-label">Association No:<strong style="color: red;">*</strong></label>

    <option value="NEOMAX JUNIOR CITIZEN INVESTORS WELFARE ASSOCIATION - TRICHY"
      {% if kyc.associationname == "NEOMAX JUNIOR CITIZEN INVESTORS WELFARE ASSOCIATION - TRICHY" %}selected{% endif %}>
      NEOMAX JUNIOR CITIZEN INVESTORS WELFARE ASSOCIATION - TRICHY

  </select>
</div>


<!-- Membership No -->
<div class="col-lg-3 col-md-4 col-sm-12 mb-3">
  <label>Membership No:<strong style="color: red;">*</strong></label>
  <input type="number" name="membershipno" placeholder="Membership No." value="{{ kyc.membershipno }}" class="form-control" required>
</div>

<!-- Depositor Name -->
<div class="col-lg-3 col-md-4 col-sm-12 mb-3">
  <label>Member's head of the Family Name:<strong style="color: red;">*</strong></label>
  <input type="text" name="depositorsname" placeholder="Depositor's Name" value="{{ kyc.depositorsname }}" class="form-control" required>
</div>

<!-- Depositor Mail ID -->

    <label>Member's Email ID:<strong style="color: red;">*</strong></label>
    <input type="email" name="depositorsmailid" placeholder="Depositor Mail ID" value="{{ kyc.depositorsmailid }}" class="form-control" required>
  </div>

<!-- Depositor Address -->
<div class="col-lg-3 col-md-3 col-sm-12 mb-3">
  <label>Member's Address:<strong style="color: red;">*</strong></label>
  <textarea name="depositorsaddress" placeholder="Depositor's Address" class="form-control" required>{{ kyc.depositorsaddress }}</textarea>

<!-- Depositor Mobile Number -->
<div class="col-lg-3 col-md-3 col-sm-12 mb-3">

  <input type="text" name="depositormobile_number" placeholder="Depositor Mobile Number" value="{{ kyc.depositormobile_number }}" maxlength="12" class="form-control" required>
</div>

<!-- Aadhar Number -->
<div class="col-lg-3 col-md-3 col-sm-12 mb-3">

<!-- Ration Number -->
<div class="col-lg-3 col-md-4 col-sm-12 mb-3">
  <label>Ration Number:<strong style="color: red;">*</strong></label>
  <input type="text" name="ration_number" placeholder="Ration Number" value="{{ kyc.ration_number }}" class="form-control" required>
</div>

<!-- Bank Name -->
<div class="col-lg-3 col-md-3 col-sm-12 mb-3">
  <label>Bank Name:<strong style="color: red;">*</strong></label>

<!-- Bank Account No -->

  <label>Bank Account No:<strong style="color: red;">*</strong></label>

<!-- IFSC Code -->

<!-- Agent Name -->
<div class="col-lg-3 col-md-3 col-sm-12 mb-3">

            <label class="form-label">Date of Resale:</label>

          <div class="col-lg-3 col-md-3 col-sm-12 mt-2">
            <label class="form-label">Customer ID:<strong style="color: red;">*</strong></label>
            <input type="text" name="customer_id_{{ bond.id }}" class="form-control" value="{{ bond.customer_id }}" required>
          </div>
          <div class="col-lg-3 col-md-3 col-sm-12 mt-2">
            <label class="form-label">Agent ID:<strong style="color: red;">*</strong></label>
            <input type="number" name="agentid_{{ bond.id }}" placeholder="Agent ID" class="form-control mb-2" value="{{ bond.agentid }}" required>
          </div>
          <div class="col-lg-3 col-md-3 col-sm-12 mt-2">
            <label class="form-label">Token No:<strong style="color: red;">*</strong></label>
            <input type="number" name="tokennum_{{ bond.id }}" placeholder="Token Number" class="form-control mb-2" value="{{ bond.tokennum }}" required>
          </div>
          <div class="col-lg-3 col-md-3 col-sm-12 mt-2">
            <label class="form-label">Remarks:</label>
            <input type="text" name="remarks_{{ bond.id }}" placeholder="Remarks" class="form-control mb-2" value="{{ bond.remarks }}">
          </div>
          <div class="col-lg-3 col-md-3 col-sm-12 mt-2">

    {% endfor %}

  <!-- Add New Bond Button -->
          <div class="col-lg-6 col-md-4 col-sm-12 mx-auto">

          </div>
</div>


            </div>

            <div class="col-lg-2 col-md-4 col-sm-12 mt-3 mx-auto">

<!-- Delete Bond Details -->

<script>
function confirmDeletion(button, bondId) {
  if (confirm("Are you sure you want to delete this bond-details?")) {
  // Add a hidden input so Django knows to delete this bond
  let input = document.createElement("input");
  input.type = "hidden";
  input.name = "delete_bonds";
  input.value = bondId;

  // Append to the main form
  button.closest("form").appendChild(input);

  // Hide the bond entry visually
  button.closest(".bond-entry").style.display = "none";
}
}
</script>

<!-- Aadhar number -->

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const aadharInput = document.getElementById("aadharInput");

    aadharInput.addEventListener("input", function () {
      // Only digits, max 12
      let digits = this.value.replace(/\D/g, "").substring(0, 12);

      // Add space after every 4 digits: XXXX XXXX XXXX
      let formatted = '';
      for (let i = 0; i < digits.length; i++) {
        if (i > 0 && i % 4 === 0) formatted += ' ';
        formatted += digits[i];
      }

      this.value = formatted;
    });

    aadharInput.addEventListener("keydown", function (e) {
      const allowed = ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "Tab"];
      if (allowed.includes(e.key)) return;

      // Block any non-digit key
      if (!/^\d$/.test(e.key)) {
        e.preventDefault();
      }
    });

    // Prevent invalid paste
    aadharInput.addEventListener("paste", function (e) {
      const data = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "");
      if (data.length > 12) e.preventDefault();
    });
  });
</script>

<!-- Contact of the leader -->

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const contactInput = document.querySelector('input[name="contactSH"]');

    contactInput.addEventListener("input", function () {
      // Remove all non-numeric characters
      this.value = this.value.replace(/\D/g, '');
    });

    contactInput.addEventListener("keydown", function (e) {
      const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'];
      if (allowedKeys.includes(e.key)) return;

      // Block non-numeric keys
      if (!/^\d$/.test(e.key)) {
        e.preventDefault();
      }
    });
  });
</script>
