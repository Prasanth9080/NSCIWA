{% extends "base.html" %}
{% load static %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">


<style>
  body {
    background: linear-gradient(135deg, #c3dafe, #f5e0ff);
    min-height: 100vh;
  }

  .forgot-card {
    background-color: #fff;
    border-radius: 15px;
    padding: 30px;
    max-width: 500px;
    width: 100%;
  }

  .btn-action {
    width: 100%;
    background: linear-gradient(to right, #6366f1, #3b82f6);
    border: none;
    padding: 10px;
    font-size: 16px;
    font-weight: 500;
    border-radius: 10px;
    color: white;
    transition: background 0.3s ease;
    margin-top: 20px;
  }

  .btn-action:hover {
    background: linear-gradient(to right, #4338ca, #2563eb);
    color: white;
  }

  .form-label {
    font-weight: 500;
    color: #555;
    margin-bottom: 8px;
    display: block;
  }

  .form-control {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
  }

  .message {
    margin-top: 15px;
    color: green;
    font-weight: 500;
  }
</style>

<div class="container py-5 d-flex justify-content-center align-items-center">
  <div class="forgot-card shadow-lg">
    <h3 class="text-center mb-4"><i class="bi bi-lock-fill me-2"></i>Forgot Password?</h3>

    <form method="post">
    {% csrf_token %}
    
    <label for="email" class="form-label">Email address:</label>
    <input type="email" name="email" id="email" class="form-control" required>
    
    <button type="submit" class="btn-action">Send Password Reset Email</button>
</form>

  </div>
</div>
{% endblock %}
