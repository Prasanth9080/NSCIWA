{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg rounded-4 border-0">
        <div class="card-body p-4">
          <h3 class="text-center mb-4 text-primary">Set a New Password</h3>
          <form method="post" id="passwordResetForm">
            {% csrf_token %}

            <div class="mb-3">
              <label for="new_password1" class="form-label">New Password</label>
              <input type="password" class="form-control" id="new_password1" name="new_password1" required>
            </div>

            <div class="mb-3">
              <label for="new_password2" class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" id="new_password2" name="new_password2" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Set New Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="position-fixed top-0 z-4 end-0 p-3" style="z-index: 1080">
  <!-- Mismatch Toast -->
  <div id="toastMismatch" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        Passwords do not match. Please try again.
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>

  <!-- Weak Password Toast -->
  <div id="toastWeak" class="toast align-items-center text-bg-warning border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        Password too weak. Must be at least 8 characters and not just letters.
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script>
  document.getElementById("passwordResetForm").addEventListener("submit", function (e) {
    const pwd1 = document.getElementById("new_password1").value.trim();
    const pwd2 = document.getElementById("new_password2").value.trim();

    // Check match
    if (pwd1 !== pwd2) {
      e.preventDefault();
      const toast = new bootstrap.Toast(document.getElementById("toastMismatch"));
      toast.show();
      return;
    }

    // Check strength: at least 8 chars, not all letters
    const weak = pwd1.length < 8 || /^[a-zA-Z]+$/.test(pwd1);
    if (weak) {
      e.preventDefault();
      const toast = new bootstrap.Toast(document.getElementById("toastWeak"));
      toast.show();
    }
  });
</script>
{% endblock %}
